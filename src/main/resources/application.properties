# College Management API Server Configuration

# Server port (native Java HTTP server)
server.port=7000

spring.application.name=college-management-api

# Database Configuration (matches existing user_data/config.properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/college_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# CORS allowed origins for React web app
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Token expiration (milliseconds, 24 hours)
api.token.expiration=86400000
